<text x="76.00" y="46.00" font-size="11" font-weight="400" fill="#625e55" letter-spacing="0.14em">FIGUR 7 &#183; EKSTERN KALIBRERING</text>
<text x="76.00" y="76.00" font-size="21" font-weight="600" fill="#171815">Kalibrering mot offisiell statistikk, kvartal for kvartal</text>
<text x="76.00" y="103.00" font-size="14.5" font-weight="400" fill="#625e55">Telleforhold: v&#229;r telling av konkurs&#229;pninger delt p&#229; byr&#229;ets, kvartal for kvartal. Referanselinjen 100&#160;% er byr&#229;ets tall.</text>
<text x="76.00" y="122.00" font-size="14.5" font-weight="400" fill="#625e55">Et telleforhold er ikke en dekningsgrad: verdier litt over 100&#160;% er revisjonsetterslep og avgrensningsforskjell, ikke overtelling.</text>
<text x="76.00" y="163.00" font-size="13" font-weight="600" fill="#171815">Telleforhold i prosent &#183; foretakskonkurser<tspan dx="14" font-size="12.5" font-weight="400" fill="#625e55" font-variant-numeric="tabular-nums" style="font-variant-numeric:tabular-nums">SSB-tabell 09122</tspan></text>
