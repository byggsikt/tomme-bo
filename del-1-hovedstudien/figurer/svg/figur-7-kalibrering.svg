<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 832" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="tittel7 beskr7" font-family="Euclid Circular B, Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif">
<title id="tittel7">Figur 7. Kalibrering mot offisiell statistikk, kvartal for kvartal.</title>
<desc id="beskr7">Tre panel med felles kvartalsakse fra f&#248;rste kvartal 2023 til andre kvartal 2026. &#216;verste panel viser telleforholdet mellom v&#229;r telling av konkurs&#229;pninger og Statistisk sentralbyr&#229;s foretakskonkurser (tabell 09122), for alle n&#230;ringer i bl&#229;tt og for bygge- og anleggsvirksomhet i rust; begge serier ligger mellom 97,6 og 103,5 prosent fra tredje kvartal 2023 og ut serien, rundt referanselinjen p&#229; 100 prosent i messing. Midtpanelet viser det samme telleforholdet for aksje- og allmennaksjeselskaper (tabell 07165), med kvartalsvis spenn 99,2 til 102,9 prosent. Nederste panel viser byggandelen av foretakskonkursene i begge kilder; de to kurvene f&#248;lger hverandre nesten punkt for punkt. De to f&#248;rste kvartalene i 2023 er skravert som utenfor det observerbare vinduet.</desc>
<defs><pattern id="skravur" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="9" height="9" fill="#e9e1d4"/><line x1="0" y1="0" x2="0" y2="9" stroke="#d8cfbe" stroke-width="1.3"/></pattern></defs>
