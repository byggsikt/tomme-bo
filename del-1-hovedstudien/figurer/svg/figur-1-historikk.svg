  <text x="189.09" y="334.00" font-size="20" fill="#2e6f91" font-weight="600" style="font-variant-numeric:tabular-nums">40 %</text>
  <text x="189.09" y="358.00" font-size="13" fill="#2e6f91" font-weight="600" style="font-variant-numeric:tabular-nums">«to av fem boer»</text>
  <text x="189.09" y="382.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">Kilde: Ot.prp. nr. 26 (1998-99), del 4 pkt. 1.1</text>
  <text x="189.09" y="400.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">Nevner: avsluttede bo — innstilte etter § 135</text>
  <text x="189.09" y="418.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">mot ordinært sluttede etter § 128</text>
  <text x="189.09" y="436.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">(nevneren dokumentert i NOU 1993: 16 s. 133)</text>
  <text x="526.04" y="228.00" font-size="20" fill="#2e6f91" font-weight="600" text-anchor="end" style="font-variant-numeric:tabular-nums">75 %</text>
  <text x="526.04" y="252.00" font-size="13" fill="#2e6f91" font-weight="600" text-anchor="end" style="font-variant-numeric:tabular-nums">«tre av fire boer»</text>
  <text x="526.04" y="276.00" font-size="12.5" fill="#625e55" text-anchor="end" style="font-variant-numeric:tabular-nums">Kilde: Ot.prp. nr. 26 (1998-99), del 4 pkt. 1.1</text>
  <text x="526.04" y="294.00" font-size="12.5" fill="#625e55" text-anchor="end" style="font-variant-numeric:tabular-nums">Nevner: ikke oppgitt i kilden</text>
  <text x="1144.00" y="204.00" font-size="23" fill="#9a4d35" font-weight="600" text-anchor="end" style="font-variant-numeric:tabular-nums">75,5 %</text>
  <text x="1144.00" y="228.00" font-size="13" fill="#9a4d35" font-weight="600" text-anchor="end" style="font-variant-numeric:tabular-nums">denne studiens måling — 2023/24-kohorten</text>
  <text x="1144.00" y="282.00" font-size="12.5" fill="#625e55" text-anchor="end" style="font-variant-numeric:tabular-nums">Byggsikt · 5&#160;165 bo åpnet 01.09.2023–31.12.2024</text>
  <text x="1144.00" y="300.00" font-size="12.5" fill="#625e55" text-anchor="end" style="font-variant-numeric:tabular-nums">Nevner: åpningskohorten, hvert bo fulgt til utfall</text>
  <text x="1144.00" y="318.00" font-size="12.5" fill="#625e55" text-anchor="end" style="font-variant-numeric:tabular-nums">Kumulativ insidens ved 24 mnd.: 74,8 %</text>
