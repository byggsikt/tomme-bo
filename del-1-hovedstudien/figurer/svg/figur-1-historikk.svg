  <text x="357.56" y="548.00" font-size="12.5" fill="#8c9a8e" text-anchor="middle" style="font-variant-numeric:tabular-nums">1977–1995 · ingen observasjon</text>
  <line x1="561.45" y1="528.00" x2="1079.25" y2="528.00" stroke="#8c9a8e" stroke-width="1" stroke-opacity="0.85"/>
  <line x1="561.45" y1="523.00" x2="561.45" y2="528.00" stroke="#8c9a8e" stroke-width="1" stroke-opacity="0.85"/>
  <line x1="1079.25" y1="523.00" x2="1079.25" y2="528.00" stroke="#8c9a8e" stroke-width="1" stroke-opacity="0.85"/>
  <text x="820.35" y="548.00" font-size="12.5" fill="#8c9a8e" text-anchor="middle" style="font-variant-numeric:tabular-nums">1997–2023 · ingen kohortkoblet observasjon — tallene som finnes, står under</text>
  <line x1="76.00" y1="570.00" x2="1144.00" y2="570.00" stroke="#d8cfbe" stroke-width="1"/>
  <text x="76.00" y="594.00" font-size="14.5" fill="#171815" font-weight="600">Mellomrommet er ikke tomt for tall — men ingen av dem kan tegnes inn på denne aksen</text>
  <text x="76.00" y="618.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">Det finnes offisielle tallfestinger for 1999, 2000, 2002, første halvår 2003 og for tiåret 2010–2019. De er ført opp under, med nevnertype.</text>
  <text x="76.00" y="636.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">Ingen av dem har åpningskohorten som nevner: de teller innstillinger i et kalenderår uten hensyn til når boene ble åpnet, eller de er andeler av bo som</text>
  <text x="76.00" y="654.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">alt var avsluttet, eller av undergrupper etter hvem som begjærte konkursen. Statistisk sentralbyrå og Brønnøysundregistrene teller åpninger, ikke utfall.</text>
  <text x="76.00" y="686.00" font-size="12.5" fill="#625e55" font-weight="600" style="font-variant-numeric:tabular-nums">1999</text>
  <text x="184.00" y="686.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">3&#160;005 innstilte bo</text>
  <text x="372.00" y="686.00" font-size="12.5" fill="#8c9a8e" style="font-variant-numeric:tabular-nums">råtall for kalenderåret</text>
  <text x="76.00" y="705.00" font-size="12.5" fill="#625e55" font-weight="600" style="font-variant-numeric:tabular-nums">2000</text>
  <text x="184.00" y="705.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">3&#160;577 innstilte bo</text>
  <text x="372.00" y="705.00" font-size="12.5" fill="#8c9a8e" style="font-variant-numeric:tabular-nums">råtall for kalenderåret</text>
  <text x="76.00" y="724.00" font-size="12.5" fill="#625e55" font-weight="600" style="font-variant-numeric:tabular-nums">2002</text>
  <text x="184.00" y="724.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">2&#160;767 innstilte bo</text>
  <text x="372.00" y="724.00" font-size="12.5" fill="#8c9a8e" style="font-variant-numeric:tabular-nums">råtall for kalenderåret</text>
  <text x="76.00" y="743.00" font-size="12.5" fill="#625e55" font-weight="600" style="font-variant-numeric:tabular-nums">1. halvår 2003</text>
  <text x="184.00" y="743.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">1&#160;691 + 524 innstilte bo</text>
  <text x="372.00" y="743.00" font-size="12.5" fill="#8c9a8e" style="font-variant-numeric:tabular-nums">råtall, konkurs + tvangsavvikling</text>
  <text x="610.00" y="686.00" font-size="12.5" fill="#625e55" font-weight="600" style="font-variant-numeric:tabular-nums">ca. 2000</text>
  <text x="718.00" y="686.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">75–80 %</text>
  <text x="906.00" y="686.00" font-size="12.5" fill="#8c9a8e" style="font-variant-numeric:tabular-nums">av avslutningene</text>
  <text x="610.00" y="705.00" font-size="12.5" fill="#625e55" font-weight="600" style="font-variant-numeric:tabular-nums">udatert utvalg</text>
  <text x="718.00" y="705.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">53 % og 77 %</text>
  <text x="906.00" y="705.00" font-size="12.5" fill="#8c9a8e" style="font-variant-numeric:tabular-nums">undergrupper etter rekvirent</text>
  <text x="610.00" y="724.00" font-size="12.5" fill="#625e55" font-weight="600" style="font-variant-numeric:tabular-nums">2010–2019</text>
  <text x="718.00" y="724.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">89,9 % (18&#160;345 av 20&#160;413)</text>
  <text x="906.00" y="724.00" font-size="12.5" fill="#8c9a8e" style="font-variant-numeric:tabular-nums">av avsluttede saker</text>
  <text x="610.00" y="743.00" font-size="12.5" fill="#625e55" font-weight="600" style="font-variant-numeric:tabular-nums">2023 og 2026</text>
  <text x="718.00" y="743.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">«90 prosent»</text>
  <text x="906.00" y="743.00" font-size="12.5" fill="#8c9a8e" style="font-variant-numeric:tabular-nums">kilden regner av avslutningene</text>
  <text x="76.00" y="786.00" font-size="11" fill="#625e55" style="font-variant-numeric:tabular-nums">Byggsikt · offentlig tilgjengelige registerkunngjøringer · utfall observert til 24.08.2026. Historiske punkter: Ot.prp. nr. 26 (1998-99) del 4 pkt. 1.1 og del 6 pkt. I.1 med NOU 1993: 16.</text>
  <text x="76.00" y="804.00" font-size="11" fill="#625e55" style="font-variant-numeric:tabular-nums">Tall i mellomrommet: Ot.prp. nr. 23 (2003-2004) pkt. 2, 7.1 og 16.2 · Mjøs, Kostøl og Pelja (2021) tabell 4 panel E · høringsnotat 13.01.2023 · Prop. 56 L (2025–2026) · Statistisk sentralbyrå.</text>
