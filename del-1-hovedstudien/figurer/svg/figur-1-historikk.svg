  <text x="76.00" y="250.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">75</text>
  <text x="76.00" y="325.00" font-size="12.5" fill="#625e55" style="font-variant-numeric:tabular-nums">50</text>
