  <text x="76.00" y="46.00" font-size="11" fill="#625e55" font-weight="500" letter-spacing="0.14em" style="letter-spacing:0.14em;font-variant-numeric:tabular-nums">FIGUR 1</text>
  <text x="76.00" y="78.00" font-size="21" fill="#171815" font-weight="600">Femti år med tall — og tre diskrete målepunkter</text>
  <text x="76.00" y="106.00" font-size="14.5" fill="#625e55">Andelen konkursbo som innstilles fordi midlene ikke dekker bobehandlingen. Tre målinger på femti år — med tre ulike nevnere.</text>
  <text x="76.00" y="126.00" font-size="14.5" fill="#625e55">Punktene er derfor aldri bundet sammen med en kurve. Aksen begynner på null.</text>
