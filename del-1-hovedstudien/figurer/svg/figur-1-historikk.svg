<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 824" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="fig1-tittel fig1-desc" width="1200" height="824">
  <title id="fig1-tittel">Femti år med tall — og tre diskrete målepunkter</title>
  <desc id="fig1-desc">Punktdiagram med verdiakse fra 0 til 100 prosent. Tre målepunkter for andelen konkursbo som innstilles etter konkursloven § 135: 1976 = 40 prosent og 1996 = 75 prosent, begge gjengitt fra Ot.prp. nr. 26 (1998-99) og tegnet som åpne ringer i kjølig blå; 2023/24-kohorten = 75,5 prosent, denne studiens egen måling på 5 165 bo, tegnet som et fylt punkt i varm rust. Punktene er ikke bundet sammen: mellomrommene 1977–1995 og 1997–2023 er markert som spenn uten kohortkoblet observasjon. Under diagrammet står de offisielle tallene fra 1999 til 2019 som finnes, men som ikke kan tegnes inn fordi de har en annen nevner.</desc>
  <g font-family="Euclid Circular B, Inter, system-ui, -apple-system, Segoe UI, Arial, sans-serif" font-variant-numeric="tabular-nums" style="font-variant-numeric:tabular-nums">
